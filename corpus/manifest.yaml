      pull_request: 86
      path: src/rpc/methods.rs
      before_commit: cca0a575c15545b66c0c0bb665e4d02ab605a4e9
      after_commit: 553539f06c3d7a301dfbf034ee012d55251b60aa
      license: Apache-2.0

  - id: real-audius-api-go-constant
    entry: tx-v1
    files: { before: before.go, after: after.go }
    expect: { rule: go-client-max-version-zero, confidence: breaks }
    detected: true
    source:
      kind: repository
      repository: AudiusProject/api
      pull_request: 1040
      path: solana/indexer/common/transaction.go
      before_commit: 1d398f977396bdd5bf5346a17c35be23c4f8dc5e
      after_commit: 53f7da590c9abd8be6ccfa9dfe5a0a146acca368
      license: Apache-2.0

  - id: real-private-channels-json-macro
    entry: tx-v1
    files: { before: before.rs, after: after.rs }
    expect: { rule: rpc-max-version-zero, confidence: breaks }
    detected: true
    source:
      kind: repository
      repository: solana-foundation/solana-private-channels
      pull_request: 303
      path: indexer/src/indexer/datasource/rpc_polling/rpc.rs
      before_commit: 46a8e243df3bf6668b79f01f492d8fe0b9535cf6
      after_commit: a9802b18e86f3c482fdca5732798d39d3273678f
      license: MIT

  - id: synthetic-rust-client-config
    entry: tx-v1
    files: { before: before.rs, after: after.rs }
    expect: { rule: rust-client-max-version-zero, confidence: breaks }
    detected: true
    source:
      kind: synthetic
      reason: >-
        The shape of real fixes (sig-net/mpc#1215, and a cookbook example of solana-com found in the field);
        the fix that shows it best is under AGPL-3.0 and is referred to, not copied.

  - id: synthetic-formatter-line-break
    entry: tx-v1
    files: { before: before.ts, after: after.ts }
    expect: { rule: rpc-max-version-zero, confidence: breaks }
    detected: true
    source:
      kind: synthetic
      reason: Reproduces a reported miss; no instance was found in the field. The value sits on the line after the colon.

  - id: synthetic-variable-value
    entry: tx-v1
    files: { before: before.ts, after: after.ts }
    expect: { rule: rpc-max-version-dynamic, confidence: check }
    detected: true
    source:
      kind: synthetic
      reason: The value comes from a variable; the rule can only ask a person to look.

  - id: synthetic-docs-snippet
    entry: tx-v1
    files: { before: before.md, after: after.md }
    expect: { rule: docs-teach-max-version-zero, confidence: check }
    detected: true
    source:
      kind: synthetic
      reason: >-
        Documentation that teaches the pattern. Real instances exist, but the ones found so far sit in
        repositories without a licence that allows copying.

  - id: synthetic-web3js-lockfile
    entry: tx-v1
    files: { before: before.package-lock.json, after: after.package-lock.json, as: package-lock.json }
    expect: { rule: web3js-below-1-99, confidence: check }
    detected: true
    source:
      kind: synthetic
      reason: A lockfile cut down to the one package the rule reads.

  - id: synthetic-omitted-parameter
    entry: tx-v1
    files: { before: before.ts, after: after.ts }
    expect: { rule: rpc-read-without-max-version, confidence: check }
    detected: true
    source:
      kind: synthetic
      reason: The entry states this break; no public fix of it was found that could be copied.

  - id: synthetic-decoder-version-byte
    entry: tx-v1
    files: { before: before.ts, after: after.ts }
    expect: { confidence: check }
    detected: false
    gap: >-
      No rule, on purpose. A decoder has no fixed shape, and a pattern loose enough to find the version byte
      being read finds it in the fixed decoder as well: the after side would not be silent.
    source:
      kind: synthetic
      reason: The entry states this break (the version byte of version 1 has no branch in older decoders).

# Code that looks like a case and is not one: every rule of the entry must stay silent on it.
quiet:
  - id: quiet-other-chain-same-method
    entry: tx-v1
    file: sample.ts
    reason: Clients of other chains use the method names of the Solana RPC; seen in multi-chain projects of the field corpus.
