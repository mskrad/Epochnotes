# Alpenglow consensus (SIMD-0326). Each `breaks` item names its evidence as indexes into `sources`.
# Activation status is not stored here: it is read from the feature gate account at check time.
schema_version: 1
id: alpenglow
rev: 1
axis: protocol
subject:
  type: simd
  name: SIMD-0326
  title: Alpenglow
applies:
  gates:
    - address: A1pengvuM6JEcyNuTnMqepBKhwHE3N6PmUrdATGawhJS
      label: alpenglow
      effect: 'Feature gate registered in agave as "SIMD-0326: Alpenglow: new consensus algorithm".'
relations:
  - type: related
    id: slot-duration
breaks:
  - surface: stream
    summary: >-
      Votes stop being transactions on chain: validators send them directly to each other. Initially a
      validator admission ticket reproduces the incentives of today's vote transaction fees. Voting is not
      invisible afterwards: for rewards, the leader of slot s+8 can post up to two vote aggregates for
      slot s. Code that reads individual vote transactions out of blocks no longer finds them.
    evidence: [0]
  - surface: rpc
    summary: >-
      Optimistic confirmation is superseded by faster actual finality; the SIMD names this as the most
      visible change.
    evidence: [0]
fix:
  - summary: >-
      Do not derive validator activity from vote transactions in blocks, and review code that relies on
      optimistic confirmation as something distinct from finality.
sources:
  - kind: simd
    ref: https://github.com/solana-foundation/solana-improvement-documents/blob/2df3442ef8fc/proposals/0326-alpenglow.md
    retrieved: '2026-09-18'
    note: >-
      Document status at retrieval is Review; the front matter feature field is still a placeholder, the gate
      address comes from agave. Backwards compatibility is stated as Incompatible: Alpenglow
      replaces the old consensus protocol with all its voting logic.
  - kind: source-code
    ref: https://github.com/anza-xyz/agave/blob/583d4560e7d1/feature-set/src/lib.rs
    retrieved: '2026-09-18'
    note: Module alpenglow. A separate gate alpenglow_fast_leader_handover (SIMD-0326 fast leader handover) is not covered by this entry.
