    retrieved: '2026-10-02'
    note: Isthmus brings the Pectra execution layer, EIP-7702 among its EIPs (lines 15-16).
  - kind: docs
    ref: https://github.com/ethereum-optimism/specs/blob/f7cefd23a79e072ea90e033dae5d2e3685d0f10c/specs/protocol/isthmus/exec-engine.md
    retrieved: '2026-10-02'
