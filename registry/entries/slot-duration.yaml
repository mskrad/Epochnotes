    retrieved: '2026-10-25'
    note: >-
      Block times of slots 460291500, 461191500 and 461291500 put 1,000,000 slots at 212,131 s and the last 100,000
      at 21,224 s (212.1 and 212.2 ms per slot); five 60 s performance samples held 277 to 285 slots. The public
      endpoint answered getBlockTime with the header x-ratelimit-method-limit 10, and getSlot and
      getRecentPerformanceSamples with 150.
