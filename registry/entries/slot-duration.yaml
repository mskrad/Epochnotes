relations:
  - type: related
    id: alpenglow
breaks:
  - surface: program
    summary: >-
      A duration expressed in slots shrinks in wall-clock time with every stage: the SIMD tells dapp
      developers and off-chain services to stop assuming that 400 ms * slots is a stable conversion.
      A timer of N slots lasts half as long at 200 ms as it did at 400 ms.
    evidence: [0]
  - surface: sdk
    summary: >-
      SDK constants stay at their 400 ms values at first: static constants for default slot duration, ticks
      per second, slots per year and slot-to-time conversion may keep describing 400 ms while the cluster runs
      350, 300, 250 or 200 ms banks.
    evidence: [0]
  - surface: economics
    summary: >-
      Per-slot limits scale down in proportion to the slot time so that the wall-clock rate stays
      approximately the same. From the 400 ms baseline of 60,000,000 the maximum block compute units become
      37,500,000 at 250 ms and 30,000,000 at 200 ms; the maximum writable-account compute units go from
      24,000,000 to 15,000,000 and 12,000,000. The ratios apply to whatever baseline is active: with the
      100,000,000 block limit of SIMD-0286 the values are 62,500,000 and 50,000,000. Code tuned to the
      per-block or per-account limit of a 400 ms slot exceeds the scaled one.
    evidence: [0]
  - surface: program
    summary: >-
      An epoch stays 432,000 slots, so it lasts half as long at 200 ms as at 400 ms. Anything scheduled per
      epoch happens twice as often in wall-clock time.
    evidence: [0]
detect:
  - rule: slot-time-400ms-conversion
    kind: code-pattern
    confidence: breaks
    summary: >-
      Converts between slots and time at a fixed 400 ms per slot: 400, 0.4 or 2.5 in arithmetic next to a slot or
      a timestamp, or the SDK constant DEFAULT_MS_PER_SLOT or DEFAULT_S_PER_SLOT. With shorter slots the result is
      off in proportion, and the error grows with the distance in slots.
    languages: [ts, js, rust, python, go]
    pattern: '[*/](?<![/*][*/])(?![/*=])(?:[ \t]{0,8}(?:(?<![\w.])(?:400(?:\.0)?|0?\.4|2\.5)(?![\d.])|(?:[\w$]{1,40}(?:\.|::)){0,3}DEFAULT_M?S_PER_SLOT\b)|(?<=(?:(?<![\w.])(?:400(?:\.0)?|0?\.4|2\.5)(?![\d.])|\bDEFAULT_M?S_PER_SLOT\b)[ \t]{0,8}\*)(?![ \t]{0,8}time\.))(?:(?<=(?:[sS]lot|SLOT|432_?000\b|[bB]lock_?[tT]ime|[tT]imestamp)[^\n]{0,80})|(?=[^\n]{0,80}(?:[sS]lot|SLOT|432_?000\b|[bB]lock_?[tT]ime|[tT]imestamp)))(?<!(?:\b(?:sleep|wait|delay|poll|retry|backoff)|Sleep|Wait|Delay|Poll|Retry|Backoff|setTimeout|setInterval|[tT]imeout|[iI]nterval|from_millis|from_secs|Duration::|Duration\(|\.Millisecond|\.Second\b)[^\n;]{0,60})(?![^\n;]{0,60}(?:\b(?:sleep|wait|delay|poll|retry|backoff)|Sleep|Wait|Delay|Poll|Retry|Backoff|setTimeout|setInterval|[tT]imeout|[iI]nterval|from_millis|from_secs|Duration::|Duration\(|\.Millisecond|\.Second\b))'
  - rule: slot-time-400ms-wait
    kind: code-pattern
    confidence: check
    summary: >-
      Waits for a number of slots at a fixed 400 ms per slot. A pause or a poll only gets longer than needed on a
      cluster with shorter slots; a refresh or a timeout that has to stay inside a window counted in slots or
      blocks fires late.
    languages: [ts, js, rust, python, go]
    pattern: '[*/](?<![/*][*/])(?![/*=])(?:[ \t]{0,8}(?:(?<![\w.])(?:400(?:\.0)?|0?\.4|2\.5)(?![\d.])|(?:[\w$]{1,40}(?:\.|::)){0,3}DEFAULT_M?S_PER_SLOT\b)|(?<=(?:(?<![\w.])(?:400(?:\.0)?|0?\.4|2\.5)(?![\d.])|\bDEFAULT_M?S_PER_SLOT\b)[ \t]{0,8}\*)(?![ \t]{0,8}time\.))(?:(?<=(?:[sS]lot|SLOT|432_?000\b|[bB]lock_?[tT]ime|[tT]imestamp)[^\n]{0,80})|(?=[^\n]{0,80}(?:[sS]lot|SLOT|432_?000\b|[bB]lock_?[tT]ime|[tT]imestamp)))(?:(?<=(?:\b(?:sleep|wait|delay|poll|retry|backoff)|Sleep|Wait|Delay|Poll|Retry|Backoff|setTimeout|setInterval|[tT]imeout|[iI]nterval|from_millis|from_secs|Duration::|Duration\(|\.Millisecond|\.Second\b)[^\n;]{0,60})|(?=[^\n;]{0,60}(?:\b(?:sleep|wait|delay|poll|retry|backoff)|Sleep|Wait|Delay|Poll|Retry|Backoff|setTimeout|setInterval|[tT]imeout|[iI]nterval|from_millis|from_secs|Duration::|Duration\(|\.Millisecond|\.Second\b)))'
  - rule: slot-time-400ms-constant
    kind: code-pattern
    confidence: check
    summary: >-
      Declares a slot duration of 400 ms (0.4 s, 2.5 slots per second, or 150, 9,000, 216,000 or 78,840,000 slots
      per minute, hour, day or year). Check what it is used for: a pause is only slower, a conversion between slots
      and time is wrong in proportion to the shorter slot.
    languages: [ts, js, rust, python, go]
    pattern: '=(?:(?=[ \t]{0,8}(?<![\w.])(?:400(?:\.0)?|0?\.4|2\.5)(?![\d.]))(?<=(?:\b[A-Z0-9_]{0,30}(?:M?S_PER_SLOT|SECONDS_PER_SLOT|MILLIS(?:ECONDS)?_PER_SLOT|SLOT_(?:TIME|DURATION|MS|LENGTH)|SLOTS_PER_SEC(?:OND)?)[A-Z0-9_]{0,20}|\b(?:const|static)[ \t]{1,8}(?:mut[ \t]{1,8})?[\w$]{0,30}(?:(?:[mM][sS]|[mM]illis|[sS]ec(?:ond)?s?)(?:Per|_per_)(?:[sS]lot)|[sS]lot_?(?:[tT]ime|[dD]uration|[mM]s\b|Ms)|[sS]lots(?:Per|_per_)[sS]ec)[\w$]{0,20})[ \t]{0,8}(?::[ \t]{0,8}[\w:<>.&'']{1,30}[ \t]{0,8})?=)|(?=[ \t]{0,8}(?<![\w.])(?:150|9_?000|216_?000|78_?840_?000)(?![\d.]))(?<=(?:\b[A-Z0-9_]{0,30}SLOTS_PER_(?:MINUTE|MIN|HOUR|DAY|YEAR)[A-Z0-9_]{0,20}|\b(?:const|static)[ \t]{1,8}(?:mut[ \t]{1,8})?[\w$]{0,30}[sS]lots(?:Per|_per_)(?:Minute|Min|Hour|Day|Year|minute|min|hour|day|year)[\w$]{0,20})[ \t]{0,8}(?::[ \t]{0,8}[\w:<>.&'']{1,30}[ \t]{0,8})?=))[ \t]{0,8}[\d.]'
fix:
  - summary: >-
      Keep slot counts only where slot semantics are intended; where a duration means wall-clock time, do not
      derive it from a fixed milliseconds-per-slot constant. The SIMD advises preferring cluster-provided
      timing parameters once they are available.
  - summary: >-
      Do not turn slots into time or time into slots with a fixed rate. Read getBlockTime for the time of a slot;
      for the slot of a time, search getBlockTime between a slot known to be older and the latest slot, stepping
      over skipped slots; for an estimate, take the current rate from getRecentPerformanceSamples. Space the
      getBlockTime calls of a search: the public mainnet endpoint allows that method far fewer requests than getSlot.
    for_rules: [slot-time-400ms-conversion, slot-time-400ms-constant]
  - summary: >-
      Where a wait has to end before a window counted in slots or blocks closes, count slots (getSlot) or block
      height (getBlockHeight) instead of milliseconds; a plain pause can stay as it is.
    for_rules: [slot-time-400ms-wait, slot-time-400ms-constant]
