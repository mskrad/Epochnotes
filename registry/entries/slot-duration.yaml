# Slot time reduction from 400 ms to 200 ms (SIMD-0525). Each `breaks` item names its evidence as indexes into `sources`.
# Activation status is not stored here: it is read from the feature gate accounts at check time.
schema_version: 1
id: slot-duration
rev: 1
axis: protocol
subject:
  type: simd
  name: SIMD-0525
  title: Reduce Slot Times
applies:
  gates:
    - address: iBRL5RuWhw4yqaAZu96RUULHckHTZAoe2b77qaV38JZ
      label: reduce_slot_time_to_350ms
      effect: Target slot time 350 ms. Takes effect one epoch after the gate is activated.
    - address: iBRLL3k18HST852F1Mf3Lv83waTNQmmqvKDxvYGwQFL
      label: reduce_slot_time_to_300ms
      effect: Target slot time 300 ms. Takes effect one epoch after the gate is activated.
    - address: iBRLMc81UjRa8fn8A6eE8bJTnRbgQoPTynM51akENCV
      label: reduce_slot_time_to_250ms
      effect: Target slot time 250 ms. Takes effect one epoch after the gate is activated.
    - address: iBRLjhJnkmDZgNoZRDMW11d8ZV7HvsL3vAyRjZB5npW
      label: reduce_slot_time_to_200ms
      effect: Target slot time 200 ms. Takes effect one epoch after the gate is activated.
relations:
  - type: related
    id: alpenglow
breaks:
  - surface: program
    summary: >-
      A duration expressed in slots shrinks in wall-clock time with every stage: the SIMD tells dapp
      developers and off-chain services to stop assuming that 400 ms * slots is a stable conversion.
      A timer of N slots lasts half as long at 200 ms as it did at 400 ms.
    evidence: [0]
  - surface: sdk
    summary: >-
      SDK constants stay at their 400 ms values at first: static constants for default slot duration, ticks
      per second, slots per year and slot-to-time conversion keep describing 400 ms while the cluster runs
      350, 300, 250 or 200 ms banks.
    evidence: [0]
  - surface: economics
    summary: >-
      Per-slot limits scale down with the slot time so that the wall-clock rate stays the same: the maximum
      block compute units go from 60,000,000 at 400 ms to 37,500,000 at 250 ms and 30,000,000 at 200 ms, the
      maximum writable-account compute units from 24,000,000 to 15,000,000 and 12,000,000. Code tuned to the
      per-block or per-account limit of a 400 ms slot exceeds the new one.
    evidence: [0]
  - surface: program
    summary: >-
      An epoch stays 432,000 slots, so it lasts half as long at 200 ms as at 400 ms. Anything scheduled per
      epoch happens twice as often in wall-clock time.
    evidence: [0]
fix:
  - summary: >-
      Keep slot counts only where slot semantics are intended; where a duration means wall-clock time, do not
      derive it from a fixed milliseconds-per-slot constant. The SIMD advises preferring cluster-provided
      timing parameters once they are available.
sources:
