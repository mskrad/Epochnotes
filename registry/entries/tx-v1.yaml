# Transaction V1 (SIMD-0385). Each `breaks` item names its evidence as indexes into `sources`.
# Activation status is not stored here: it is read from the feature gate account at check time.
schema_version: 1
id: tx-v1
rev: 1
axis: protocol
subject:
  type: simd
  name: SIMD-0385
  title: Transaction V1 Format
applies:
  gates:
    - address: txv1aq4pp281K9um3tnPgkfX8UqtFT6wcVW3hNezGLL
      label: enable_tx_v1
      effect: 'Feature gate registered in agave as "SIMD-0385: Transaction V1".'
relations: []
breaks:
  - surface: rpc
    summary: >-
      getTransaction, and getBlock with transactionDetails full or accounts, fail with JSON-RPC error -32015
      "Transaction version (1) is not supported by the requesting client" when the request omits
      maxSupportedTransactionVersion or sets it to 0 and the result contains a version 1 transaction.
      getBlock with transactionDetails signatures or none is not affected.
    evidence: [2, 3]
  - surface: decoder
    summary: >-
      A serialized version 1 transaction starts with the version byte 129 (0x81). A decoder written for the
      legacy and version 0 layouts has no branch for that value.
    evidence: [0, 3]
  - surface: sdk
    summary: >-
      @solana/kit 8.0.0 removed three compute-unit-limit helpers from @solana/kit in favour of resource-limit
      helpers that also set the loaded accounts data size limit for version 1 transactions, and removed the
      fixed transaction size constants from @solana/transactions because version 1 transactions have a
      larger size limit.
    evidence: [4]
  - surface: decoder
    summary: >-
      The maximum size of a version 1 transaction is 4096 bytes; the prior maximum was 1232. A buffer or a
      size check fixed at 1232 bytes is too small for a valid version 1 transaction.
    evidence: [0, 5, 4]
  - surface: sdk
    summary: >-
      @solana/web3.js 1.98.4 cannot read a version 1 transaction even when maxSupportedTransactionVersion is 1:
      getTransaction and getParsedTransaction throw a StructError on the version field, and getBlock fails the
      same way. 1.99.0 reads all three and returns a MessageV1.
    evidence: [6]
detect:
  - rule: rpc-max-version-zero
    kind: code-pattern
    confidence: breaks
    summary: RPC read call pins maxSupportedTransactionVersion to the literal 0; it fails as soon as the result contains a version 1 transaction.
    languages: [ts, js, rust, go, python]
    pattern: 'maxSupportedTransactionVersion"?\s*:\s*0\b'
  - rule: rust-client-max-version-zero
    kind: code-pattern
    confidence: breaks
    summary: The Rust RPC client config pins max_supported_transaction_version to Some(0); reads fail as soon as the result contains a version 1 transaction.
    languages: [rust]
    pattern: 'max_supported_transaction_version\s*:\s*Some\(\s*0\s*\)'
  - rule: go-client-max-version-zero
    kind: code-pattern
    confidence: breaks
    summary: The Go RPC client names version 0 through the SDK constant or a uint64(0) value; reads fail as soon as the result contains a version 1 transaction.
    languages: [go]
    pattern: 'MaxSupportedTransactionVersion0\b|[mM]axSupportedTransactionVersion\s*:?=\s*uint64\(0\)'
  - rule: rpc-read-without-max-version
    kind: code-pattern
    confidence: check
    summary: >-
      A transaction or block is read without maxSupportedTransactionVersion, which the RPC treats like the
      lowest version. Check that this is a Solana RPC call: libraries of other chains use the same method names.
    languages: [ts, js]
    pattern: '\.(getTransaction|getParsedTransaction|getParsedTransactions|getBlock|getParsedBlock)\((?!\s*[{''"`)])(?![^;]{0,400}maxSupportedTransactionVersion)'
  - rule: rpc-max-version-dynamic
    kind: code-pattern
    confidence: check
    summary: maxSupportedTransactionVersion is set from a non-literal value; verify it resolves to 1 or higher.
    languages: [ts, js]
    pattern: 'maxSupportedTransactionVersion\s*:\s*[A-Za-z_$]'
  - rule: docs-teach-max-version-zero
    kind: code-pattern
    confidence: check
    summary: Documentation or an AI skill shows maxSupportedTransactionVersion 0; readers and coding assistants copy it.
    languages: [markdown]
    pattern: 'maxSupportedTransactionVersion"?\s*:\s*0\b'
  - rule: web3js-below-1-99
    kind: lockfile-version
    confidence: check
    summary: >-
      @solana/web3.js older than 1.99.0 cannot read a version 1 transaction at all: even with
      maxSupportedTransactionVersion 1 it rejects the response while parsing it.
    package:
      ecosystem: npm
      name: '@solana/web3.js'
      range: '<1.99.0'
  - rule: kit-below-8
    kind: lockfile-version
    confidence: check
    summary: 'Upgrading @solana/kit to 8.0.0 removes three compute-unit-limit helpers; code that calls them stops compiling.'
    package:
      ecosystem: npm
      name: '@solana/kit'
      range: '<8.0.0'
  - rule: rpc-reads-v1-transaction
    kind: runtime-probe
    confidence: breaks
    summary: The project's transaction reader is run against a known version 1 transaction.
    probe:
      method: getTransaction
      fixture: mainnet-beta:4PP1qEAF4NAKemZJrfGXhHV5yAQPwx2Dufs3Q8Gmeb7TEhHnaTQDC5RD147QVCXGfpJZFWdR1ENiUk59qToTp6K5
      expect: Result has version 1 and no JSON-RPC error.
fix:
  - summary: Pass maxSupportedTransactionVersion 1 in getTransaction and getBlock; with @solana/web3.js this also needs version 1.99.0 or later.
    for_rules:
      [
        rpc-max-version-zero,
        rust-client-max-version-zero,
        go-client-max-version-zero,
        rpc-read-without-max-version,
        rpc-max-version-dynamic,
        docs-teach-max-version-zero,
        web3js-below-1-99,
        rpc-reads-v1-transaction,
      ]
  - summary: When moving to @solana/kit 8.0.0 or later, replace the compute-unit-limit helpers with the resource-limit helpers named in the release notes.
    for_rules: [kit-below-8]
    links:
      - https://github.com/anza-xyz/kit/releases/tag/v8.0.0
sources:
  - kind: simd
    ref: https://github.com/solana-foundation/solana-improvement-documents/blob/2df3442ef8fc/proposals/0385-transaction-v1.md
    retrieved: '2026-09-18'
    note: Document status at retrieval is Review; the front matter feature field is still a placeholder.
  - kind: source-code
    ref: https://github.com/anza-xyz/agave/blob/583d4560e7d1/feature-set/src/lib.rs
    retrieved: '2026-09-18'
    note: 'Module enable_tx_v1, registered as "SIMD-0385: Transaction V1".'
  - kind: rpc-observation
    ref: mainnet-beta getBlock slot 448063686
    retrieved: '2026-09-18'
    note: >-
      With transactionDetails full: parameter omitted or 0 returns -32015; parameter 1 returns 1139
      transactions, 98 of them version 1. transactionDetails accounts returns -32015 with the parameter omitted or 0;
      signatures and none succeed without the parameter.
  - kind: rpc-observation
    ref: mainnet-beta getTransaction 4PP1qEAF4NAKemZJrfGXhHV5yAQPwx2Dufs3Q8Gmeb7TEhHnaTQDC5RD147QVCXGfpJZFWdR1ENiUk59qToTp6K5
    retrieved: '2026-09-18'
    note: Parameter omitted and parameter 0 both return -32015; parameter 1 returns version 1, first byte 0x81.
  - kind: release
    ref: https://github.com/anza-xyz/kit/releases/tag/v8.0.0
    retrieved: '2026-09-18'
  - kind: simd
    ref: https://github.com/solana-foundation/solana-improvement-documents/blob/2df3442ef8fc/proposals/0296-larger-transactions.md
    retrieved: '2026-09-18'
    note: Proposes the 4096-byte transaction size; SIMD-0385 sets the same value in its Transaction Constraints table.
  - kind: rpc-observation
    ref: mainnet-beta getTransaction 4PP1qEAF4NAKemZJrfGXhHV5yAQPwx2Dufs3Q8Gmeb7TEhHnaTQDC5RD147QVCXGfpJZFWdR1ENiUk59qToTp6K5 through @solana/web3.js
    retrieved: '2026-09-18'
    note: >-
      With maxSupportedTransactionVersion 1, web3.js 1.98.4 throws StructError "At path: version -- Expected the
      value to satisfy a union of `literal | literal`, but received: 1" for getTransaction and
      getParsedTransaction, and getBlock (slot 448063686) fails the same way; web3.js 1.99.0 returns version 1
      with a MessageV1. With 0, web3.js 1.99.0 throws SolanaJSONRPCError with code -32015.
